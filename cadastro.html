<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar - Blocos Feministas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind CSS Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: "var(--border)",
            input: "var(--input)",
            ring: "var(--ring)",
            background: "var(--background)",
            foreground: "var(--foreground)",
            primary: {
              DEFAULT: "hsl(var(--primary))",
              foreground: "hsl(var(--primary-foreground))",
              glow: "hsl(var(--primary-glow))",
            },
            secondary: {
              DEFAULT: "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            destructive: {
              DEFAULT: "hsl(var(--destructive))",
              foreground: "hsl(var(--destructive-foreground))",
            },
            success: {
              DEFAULT: "hsl(var(--success))",
              foreground: "hsl(var(--success-foreground))",
            },
            muted: {
              DEFAULT: "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            accent: {
              DEFAULT: "hsl(var(--accent))",
              foreground: "hsl(var(--accent-foreground))",
            },
            popover: {
              DEFAULT: "hsl(var(--popover))",
              foreground: "hsl(var(--popover-foreground))",
            },
            card: {
              DEFAULT: "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
            carnival: {
              purple: "hsl(var(--carnival-purple))",
              pink: "hsl(var(--carnival-pink))",
              gold: "hsl(var(--carnival-gold))",
              orange: "hsl(var(--carnival-orange))",
            }
          },
          boxShadow: {
            'carnival': 'var(--shadow-carnival)',
            'soft': 'var(--shadow-soft)',
            'glow': 'var(--shadow-glow)',
          },
          borderRadius: {
            lg: "var(--radius)",
            md: "calc(var(--radius) - 2px)",
            sm: "calc(var(--radius) - 4px)",
          }
        }
      }
    }
  </script>

  <!-- Global Custom CSS -->
  <link rel="stylesheet" href="assets/css/global.css">
</head>
<body class="min-h-screen bg-background text-foreground flex flex-col transition-all duration-300">

  <!-- Header Dynamic Element -->
  <div id="header-placeholder"></div>

  <!-- Main Container -->
  <div class="flex-grow flex items-center justify-center p-4 py-16">
    <div class="w-full max-w-md bg-gradient-card border border-border rounded-xl p-6 sm:p-8 shadow-carnival relative overflow-hidden">
      <!-- Decorator glow -->
      <div class="absolute -top-12 -right-12 w-24 h-24 bg-primary/20 rounded-full blur-xl"></div>
      
      <!-- Back arrow -->
      <a href="index.html" class="inline-flex items-center gap-1.5 text-xs text-muted-foreground hover:text-foreground font-semibold mb-6 transition-smooth">
        To início
      </a>
      
      <!-- Title -->
      <div class="text-center mb-8">
        <h2 class="text-3xl font-extrabold gradient-text tracking-tight">Crie sua conta</h2>
        <p class="text-sm text-muted-foreground mt-2 font-medium">Cadastre-se para divulgar seu bloco no mapa nacional</p>
      </div>
      
      <!-- Form fields -->
      <form id="register-form" onsubmit="handleRegisterSubmit(event)" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">E-mail</label>
          <input 
            type="email" 
            id="email" 
            placeholder="exemplo@email.com" 
            required
            class="w-full px-3.5 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
          />
        </div>
        
        <div>
          <label for="password" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Senha</label>
          <input 
            type="password" 
            id="password" 
            placeholder="••••••••" 
            required
            minlength="6"
            class="w-full px-3.5 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
          />
        </div>

        <div>
          <label for="confirm-password" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Confirmar Senha</label>
          <input 
            type="password" 
            id="confirm-password" 
            placeholder="••••••••" 
            required
            minlength="6"
            class="w-full px-3.5 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
          />
        </div>
        <!-- Termo LGPD -->
        <div class="flex items-start gap-2.5 pt-2">
          <input
            type="checkbox"
            id="lgpd-consent"
            required
            class="mt-1 w-4 h-4 cursor-pointer accent-primary"
          />
          <label for="lgpd-consent" class="text-xs text-muted-foreground cursor-pointer flex-1 leading-snug">
            Autorizo o tratamento do meu e-mail para fins de cadastro e login na plataforma Carnaval Feminino, em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018). *
          </label>
        </div>
        
        <div class="pt-2">
          <button 
            type="submit"
            class="w-full bg-primary hover:bg-primary/95 text-white font-bold py-3 px-4 rounded-lg text-sm shadow-md shadow-primary/20 transition-all duration-300 hover:scale-[1.01] flex items-center justify-center gap-2"
          >
            Cadastrar Conta
          </button>
        </div>
      </form>
      
      <!-- Login Footer -->
      <div class="text-center mt-6 pt-6 border-t border-border/40">
        <p class="text-xs text-muted-foreground">
          Já tem conta? 
          <a href="login.html" class="text-primary font-bold hover:underline">Faça login aqui</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Shared JS Library -->
  <script src="assets/js/db.js"></script>

  <!-- Registration Handling -->
  <script>
    // Redirect if user already logged in
    window.addEventListener('load', () => {
      if (getCurrentUser()) {
        window.location.href = 'admin.html';
      }
    });

    async function handleRegisterSubmit(event) {
      event.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        showToast('Erro: As senhas informadas não coincidem! ⚠️');
        return;
      }
      
      try {
        const user = await register(email, password);
        showToast('Conta criada com sucesso! Redirecionando... 🎉');
        
        // Wait a second and redirect
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 1000);
      } catch (error) {
        if (error.message.includes('aguarda aprovação')) {
          showToast(error.message + ' ⏳');
          setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        } else {
          showToast('Erro: ' + error.message);
        }
      }
    }
  </script>
</body>
</html>
