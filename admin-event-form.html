<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Evento - Blocos Feministas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind CSS Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: "hsl(var(--border))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            primary: {
              DEFAULT: "hsl(var(--primary))",
              foreground: "hsl(var(--primary-foreground))",
              glow: "hsl(var(--primary-glow))",
            },
            secondary: {
              DEFAULT: "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            destructive: {
              DEFAULT: "hsl(var(--destructive))",
              foreground: "hsl(var(--destructive-foreground))",
            },
            success: {
              DEFAULT: "hsl(var(--success))",
              foreground: "hsl(var(--success-foreground))",
            },
            muted: {
              DEFAULT: "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            accent: {
              DEFAULT: "hsl(var(--accent))",
              foreground: "hsl(var(--accent-foreground))",
            },
            popover: {
              DEFAULT: "hsl(var(--popover))",
              foreground: "hsl(var(--popover-foreground))",
            },
            card: {
              DEFAULT: "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
            carnival: {
              purple: "hsl(var(--carnival-purple))",
              pink: "hsl(var(--carnival-pink))",
              gold: "hsl(var(--carnival-gold))",
              orange: "hsl(var(--carnival-orange))",
            }
          },
          boxShadow: {
            'carnival': 'var(--shadow-carnival)',
            'soft': 'var(--shadow-soft)',
            'glow': 'var(--shadow-glow)',
          },
          borderRadius: {
            lg: "var(--radius)",
            md: "calc(var(--radius) - 2px)",
            sm: "calc(var(--radius) - 4px)",
          }
        }
      }
    }
  </script>

  <!-- Global Custom CSS -->
  <link rel="stylesheet" href="assets/css/global.css">
</head>
<body class="min-h-screen bg-background text-foreground transition-all duration-300">

  <!-- Header Dynamic Element -->
  <div id="header-placeholder"></div>

  <!-- Main Container -->
  <div class="container mx-auto px-4 py-8 max-w-2xl">
    
    <!-- Page Header -->
    <div class="flex items-center justify-between mb-8 border-b border-border/50 pb-4">
      <div>
        <h1 id="form-title" class="text-3xl font-extrabold gradient-text">Novo Evento</h1>
        <p class="text-sm text-muted-foreground mt-1">Crie um novo evento associado ao seu bloco</p>
      </div>
      <a 
        href="admin.html" 
        class="border border-input hover:bg-muted text-foreground font-semibold py-2 px-4 rounded-lg text-sm transition-smooth inline-flex items-center gap-1.5"
      >
        ⬅️ Voltar
      </a>
    </div>

    <!-- Form Card -->
    <div class="rounded-xl border border-border bg-card p-6 sm:p-8 shadow-soft">
      <form id="event-form" onsubmit="handleFormSubmit(event)" class="space-y-6">
        
        <!-- Bloco Associado -->
        <div>
          <label for="blocoId" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Bloco Responsável *</label>
          <select 
            id="blocoId" 
            required
            class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
          >
            <option value="" disabled selected>Selecione um bloco...</option>
          </select>
          <p id="no-blocks-warning" class="text-xs text-destructive mt-1.5 hidden font-bold">⚠️ Você precisa cadastrar um bloco antes de poder criar um evento!</p>
        </div>

        <!-- Nome do evento -->
        <div>
          <label for="nome" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Nome do Evento *</label>
          <input 
            type="text" 
            id="nome" 
            placeholder="Ex: Ensaio de Bateria Feminista" 
            required
            class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
          />
        </div>

        <!-- Categoria do evento -->
        <div>
          <label for="tipo" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Categoria *</label>
          <select 
            id="tipo" 
            required
            class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
          >
            <option value="Ensaio">Ensaio</option>
            <option value="Oficina">Oficina</option>
            <option value="Desfile">Desfile</option>
            <option value="Show">Show</option>
          </select>
        </div>

        <!-- Descrição -->
        <div>
          <label for="descricao" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Descrição</label>
          <textarea 
            id="descricao" 
            placeholder="Detalhes sobre a programação, se precisa levar instrumentos, público alvo..."
            class="w-full min-h-24 px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
          ></textarea>
        </div>

        <!-- Data e Horário -->
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label for="data" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Data do Evento *</label>
            <input 
              type="datetime-local" 
              id="data" 
              required
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
            />
          </div>
          <div>
            <label for="horario" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Horário (Texto informativo)</label>
            <input 
              type="text" 
              id="horario" 
              placeholder="Ex: 14:00 às 17:30" 
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
            />
          </div>
        </div>

        <!-- Local do Evento -->
        <div>
          <label for="local" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Local / Endereço *</label>
          <input 
            type="text" 
            id="local" 
            placeholder="Ex: Praça Franklin Roosevelt, Consolação" 
            required
            class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
          />
        </div>

        <!-- Cidade e Estado -->
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label for="cidade" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Cidade</label>
            <input 
              type="text" 
              id="cidade" 
              placeholder="São Paulo" 
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
            />
          </div>
          <div>
            <label for="estado" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Estado (UF)</label>
            <input 
              type="text" 
              id="estado" 
              placeholder="SP" 
              maxlength="2"
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
            />
          </div>
        </div>

        <!-- Banner do Evento -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Banner do Evento (Foto)</label>
          <div class="space-y-3">
            <input 
              type="file" 
              id="foto-file" 
              accept="image/*"
              onchange="processImageFile(this)"
              class="w-full text-xs text-muted-foreground file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-primary/10 file:text-primary file:cursor-pointer cursor-pointer hover:file:bg-primary/20"
            />
            <div class="text-center text-xs text-muted-foreground font-bold py-1">OU colar URL da imagem abaixo</div>
            <input 
              type="url" 
              id="foto-url" 
              placeholder="https://images.unsplash.com/... (URL externa)" 
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none"
            />
          </div>
          <div id="foto-preview-container" class="mt-4 hidden">
            <p class="text-xs text-muted-foreground mb-1 font-semibold">Visualização do banner:</p>
            <img id="foto-preview" src="" class="w-full max-h-48 object-cover rounded-lg border border-border" />
          </div>
        </div>

        <!-- Termo LGPD -->
        <div class="flex items-start gap-2.5 pt-4 border-t border-border/40">
          <input
            type="checkbox"
            id="lgpd-consent"
            required
            class="mt-1 w-4 h-4 cursor-pointer accent-primary"
          />
          <label for="lgpd-consent" class="text-xs text-muted-foreground cursor-pointer flex-1 leading-snug">
            Autorizo o tratamento dos dados pessoais fornecidos neste formulário para fins de cadastro e divulgação da plataforma Carnaval Feminino, em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018). *
          </label>
        </div>

        <!-- Actions -->
        <div class="flex gap-3 pt-4 border-t border-border/40">
          <button 
            type="submit"
            id="submit-btn"
            class="flex-1 bg-primary hover:bg-primary/95 text-white font-bold py-3 px-4 rounded-lg text-sm shadow-md transition-all duration-300 hover:scale-[1.01]"
          >
            Salvar Evento
          </button>
          <a 
            href="admin.html" 
            class="border border-input hover:bg-muted text-foreground font-semibold py-3 px-6 rounded-lg text-sm transition-smooth text-center"
          >
            Cancelar
          </a>
        </div>

      </form>
    </div>

  </div>

  <!-- Shared JS Library -->
  <script src="assets/js/db.js"></script>

  <!-- Form Controller -->
  <script>
    let eventToEdit = null;
    let base64Photo = '';
    let currentUser = null;

    // Check auth guard and populate blocks select on load
    window.addEventListener('load', () => {
      currentUser = getCurrentUser();
      if (!currentUser) {
        window.location.href = 'login.html';
        return;
      }
      
      populateBlocksSelect();

      // Read ID if editing
      const urlParams = new URLSearchParams(window.location.search);
      const editId = urlParams.get('id');

      if (editId) {
        eventToEdit = getEvent(editId);
        if (eventToEdit) {
          fillFormWithEvent(eventToEdit);
        }
      }
    });

    window.addEventListener('userSessionUpdated', () => {
      currentUser = getCurrentUser();
      populateBlocksSelect();
      if (eventToEdit) {
        document.getElementById('blocoId').value = eventToEdit.blocoId || '';
      }
    });

    // Populate dropdown with user's blocks
    function populateBlocksSelect() {
      const select = document.getElementById('blocoId');
      select.innerHTML = '<option value="" disabled selected>Selecione um bloco...</option>';
      
      const allBlocks = getBlocks();
      
      let userBlocks = [];
      if (currentUser && currentUser.isAdmin) {
        userBlocks = allBlocks;
      } else if (currentUser) {
        userBlocks = allBlocks.filter(b => b.ownerId === currentUser.id);
      }

      if (userBlocks.length === 0) {
        document.getElementById('no-blocks-warning').classList.remove('hidden');
        document.getElementById('submit-btn').disabled = true;
      } else {
        document.getElementById('no-blocks-warning').classList.add('hidden');
        document.getElementById('submit-btn').disabled = false;
      }

      userBlocks.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.id;
        opt.innerText = b.nome;
        select.appendChild(opt);
      });
    }

    // Fill form details
    function fillFormWithEvent(ev) {
      document.getElementById('form-title').innerText = 'Editar Evento';
      document.querySelector('form p').innerText = 'Atualize as informações do seu evento';

      document.getElementById('blocoId').value = ev.blocoId || '';
      document.getElementById('nome').value = ev.nome || '';
      document.getElementById('tipo').value = ev.tipo || 'Ensaio';
      document.getElementById('descricao').value = ev.descricao || '';
      document.getElementById('horario').value = ev.horario || '';
      document.getElementById('local').value = ev.local || '';
      document.getElementById('cidade').value = ev.cidade || '';
      document.getElementById('estado').value = ev.estado || '';

      // Format datetime-local value (YYYY-MM-DDThh:mm)
      if (ev.data) {
        const d = new Date(ev.data);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        document.getElementById('data').value = `${yyyy}-${mm}-${dd}T${hh}:${min}`;
      }

      // Foto
      if (ev.foto) {
        base64Photo = ev.foto;
        document.getElementById('foto-url').value = ev.foto.startsWith('http') ? ev.foto : '';
        document.getElementById('foto-preview').src = ev.foto;
        document.getElementById('foto-preview-container').classList.remove('hidden');
      }
    }

    // Process image file input to base64
    function processImageFile(input) {
      const file = input.files[0];
      if (!file) return;

      if (file.size > 2 * 1024 * 1024) {
        showToast('Erro: A foto excede o tamanho máximo de 2MB! ⚠️');
        input.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        base64Photo = e.target.result;
        
        // Update URL input and preview
        document.getElementById('foto-url').value = '';
        document.getElementById('foto-preview').src = base64Photo;
        document.getElementById('foto-preview-container').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    // Submit event form
    async function handleFormSubmit(event) {
      event.preventDefault();

      const blocoId = document.getElementById('blocoId').value;
      const nome = document.getElementById('nome').value.trim();
      const tipo = document.getElementById('tipo').value;
      const textDescricao = document.getElementById('descricao').value.trim();
      const inputData = document.getElementById('data').value;
      const horario = document.getElementById('horario').value.trim();
      const local = document.getElementById('local').value.trim();
      const cidade = document.getElementById('cidade').value.trim();
      const estado = document.getElementById('estado').value.trim().toUpperCase();

      // Photo handling
      const urlPhoto = document.getElementById('foto-url').value.trim();
      const finalPhoto = urlPhoto ? urlPhoto : base64Photo;

      const eventData = {
        id: eventToEdit ? eventToEdit.id : undefined,
        blocoId: blocoId,
        nome: nome,
        tipo: tipo,
        descricao: textDescricao,
        data: new Date(inputData).toISOString(),
        horario: horario,
        local: local,
        cidade: cidade,
        estado: estado,
        foto: finalPhoto
      };

      try {
        await saveEvent(eventData);
        showToast('Evento salvo com sucesso! ✅');
        
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 1000);
      } catch (err) {
        showToast('Erro ao salvar evento: ' + err.message);
      }
    }

    // Sync input url to preview box
    document.getElementById('foto-url').addEventListener('input', (e) => {
      const url = e.target.value.trim();
      const container = document.getElementById('foto-preview-container');
      const img = document.getElementById('foto-preview');
      
      if (url.startsWith('http')) {
        img.src = url;
        container.classList.remove('hidden');
      } else if (!base64Photo) {
        container.classList.add('hidden');
      } else {
        img.src = base64Photo;
      }
    });
  </script>
</body>
</html>
