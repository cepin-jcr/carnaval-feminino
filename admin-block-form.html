<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Bloco - Blocos Feministas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind CSS Configuration -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            border: "hsl(var(--border))",
            input: "hsl(var(--input))",
            ring: "hsl(var(--ring))",
            background: "hsl(var(--background))",
            foreground: "hsl(var(--foreground))",
            primary: {
              DEFAULT: "hsl(var(--primary))",
              foreground: "hsl(var(--primary-foreground))",
              glow: "hsl(var(--primary-glow))",
            },
            secondary: {
              DEFAULT: "hsl(var(--secondary))",
              foreground: "hsl(var(--secondary-foreground))",
            },
            destructive: {
              DEFAULT: "hsl(var(--destructive))",
              foreground: "hsl(var(--destructive-foreground))",
            },
            success: {
              DEFAULT: "hsl(var(--success))",
              foreground: "hsl(var(--success-foreground))",
            },
            muted: {
              DEFAULT: "hsl(var(--muted))",
              foreground: "hsl(var(--muted-foreground))",
            },
            accent: {
              DEFAULT: "hsl(var(--accent))",
              foreground: "hsl(var(--accent-foreground))",
            },
            popover: {
              DEFAULT: "hsl(var(--popover))",
              foreground: "hsl(var(--popover-foreground))",
            },
            card: {
              DEFAULT: "hsl(var(--card))",
              foreground: "hsl(var(--card-foreground))",
            },
            carnival: {
              purple: "hsl(var(--carnival-purple))",
              pink: "hsl(var(--carnival-pink))",
              gold: "hsl(var(--carnival-gold))",
              orange: "hsl(var(--carnival-orange))",
            }
          },
          boxShadow: {
            'carnival': 'var(--shadow-carnival)',
            'soft': 'var(--shadow-soft)',
            'glow': 'var(--shadow-glow)',
          },
          borderRadius: {
            lg: "var(--radius)",
            md: "calc(var(--radius) - 2px)",
            sm: "calc(var(--radius) - 4px)",
          }
        }
      }
    }
  </script>

  <!-- Global Custom CSS -->
  <link rel="stylesheet" href="assets/css/global.css">
</head>
<body class="min-h-screen bg-background text-foreground transition-all duration-300">

  <!-- Header Dynamic Element -->
  <div id="header-placeholder"></div>

  <!-- Main Container -->
  <div class="container mx-auto px-4 py-8 max-w-2xl">
    
    <!-- Header Page title -->
    <div class="flex items-center justify-between mb-8 border-b border-border/50 pb-4">
      <div>
        <h1 id="form-title" class="text-3xl font-extrabold gradient-text">Novo Bloco</h1>
        <p class="text-sm text-muted-foreground mt-1">Crie um novo bloco carnavalesco feminista</p>
      </div>
      <a 
        href="admin.html" 
        class="border border-input hover:bg-muted text-foreground font-semibold py-2 px-4 rounded-lg text-sm transition-smooth inline-flex items-center gap-1.5"
      >
         Voltar
      </a>
    </div>

    <!-- Form Card -->
    <div class="rounded-xl border border-border bg-card p-6 sm:p-8 shadow-soft">
      <form id="block-form" onsubmit="handleFormSubmit(event)" class="space-y-6">
        
        <!-- Nome e Responsável -->
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label for="nome" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Nome do Bloco *</label>
            <input 
              type="text" 
              id="nome" 
              placeholder="Ex: Rosas da Resistência" 
              required
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
            />
          </div>
          <div>
            <label for="responsavel" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Nome da Responsável *</label>
            <input 
              type="text" 
              id="responsavel" 
              placeholder="Ex: Maria Santos" 
              required
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
            />
          </div>
        </div>

        <!-- Descrição -->
        <div>
          <label for="descricao" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Descrição</label>
          <textarea 
            id="descricao" 
            placeholder="Breve história ou resumo das atividades do bloco..."
            class="w-full min-h-24 px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
          ></textarea>
        </div>

        <!-- Contato e Formação -->
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label for="contato" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Contato (Telefone / Email) *</label>
            <input 
              type="text" 
              id="contato" 
              placeholder="(11) 99999-9999 | contato@bloco.com" 
              required
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
            />
          </div>
          <div>
            <label for="formacao" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Formação</label>
            <input 
              type="text" 
              id="formacao" 
              placeholder="Ex: Exclusivamente mulheres, Mista" 
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
            />
          </div>
        </div>

        <!-- Atividades checklist -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-2">Atividades Realizadas</label>
          <div id="atividades-checklist" class="space-y-2.5 bg-muted/40 p-4 rounded-lg border border-border/40 text-sm">
            <!-- Checkboxes generated dynamically -->
          </div>
        </div>

        <!-- Dias que o bloco sai -->
        <div>
          <label for="dias" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Dias de Desfile</label>
          <input 
            type="text" 
            id="dias" 
            placeholder="Ex: Segunda de Carnaval, Terça de Carnaval" 
            class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
          />
        </div>

        <!-- Endereço -->
        <div>
          <label for="endereco" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Endereço de Ensaios / Concentração</label>
          <input 
            type="text" 
            id="endereco" 
            placeholder="Rua Conselheiro Ramalho, 250, Bixiga" 
            class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
          />
        </div>

        <!-- Cidade e Estado -->
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label for="cidade" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Cidade</label>
            <input 
              type="text" 
              id="cidade" 
              placeholder="São Paulo" 
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
            />
          </div>
          <div>
            <label for="estado" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Estado (UF)</label>
            <input 
              type="text" 
              id="estado" 
              placeholder="SP" 
              maxlength="2"
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
            />
          </div>
        </div>

        <!-- Vertente Feminista -->
        <div>
          <label for="vertente" class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Vertente Feminista / Lutas</label>
          <textarea 
            id="vertente" 
            placeholder="Ex: Feminismo interseccional, transfeminismo, defesa dos direitos sexuais..."
            class="w-full min-h-16 px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth"
          ></textarea>
        </div>

        <!-- Localização coordenadas -->
        <div class="bg-muted/30 p-4 rounded-lg border border-border/40">
          <div class="flex justify-between items-center mb-3">
            <span class="text-xs font-bold uppercase text-muted-foreground"> Coordenadas Geográficas</span>
            <button 
              type="button" 
              onclick="autodetectCoordinates()"
              class="text-xs text-primary font-bold hover:underline"
            >
               Buscar pelo endereço
            </button>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label for="localLat" class="block text-[10px] font-bold text-muted-foreground mb-1">Latitude</label>
              <input 
                type="number" 
                step="any"
                id="localLat" 
                placeholder="-23.5505" 
                class="w-full px-3 py-2 border border-input rounded-lg bg-background text-xs text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50"
              />
            </div>
            <div>
              <label for="localLng" class="block text-[10px] font-bold text-muted-foreground mb-1">Longitude</label>
              <input 
                type="number" 
                step="any"
                id="localLng" 
                placeholder="-46.6333" 
                class="w-full px-3 py-2 border border-input rounded-lg bg-background text-xs text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50"
              />
            </div>
          </div>
        </div>

        <!-- Redes Sociais -->
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Instagram (@handle)</label>
            <input 
              type="text" 
              id="instagram" 
              placeholder="@seu_bloco" 
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none"
            />
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Facebook (Nome da página)</label>
            <input 
              type="text" 
              id="facebook" 
              placeholder="Bloco Rosas da Resistência" 
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none"
            />
          </div>
        </div>

        <!-- Upload de Fotos -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-muted-foreground mb-1">Foto Principal do Bloco</label>
          <div class="space-y-3">
            <input 
              type="file" 
              id="foto-file" 
              accept="image/*"
              onchange="processImageFile(this)"
              class="w-full text-xs text-muted-foreground file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-primary/10 file:text-primary file:cursor-pointer cursor-pointer hover:file:bg-primary/20"
            />
            <div class="text-center text-xs text-muted-foreground font-bold py-1">OU colar URL da imagem abaixo</div>
            <input 
              type="url" 
              id="foto-url" 
              placeholder="https://images.unsplash.com/... (URL externa)" 
              class="w-full px-3 py-2.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none"
            />
          </div>
          <div id="foto-preview-container" class="mt-4 hidden">
            <p class="text-xs text-muted-foreground mb-1 font-semibold">Visualização da foto:</p>
            <img id="foto-preview" src="" class="w-full max-h-48 object-cover rounded-lg border border-border" />
          </div>
        </div>

        <!-- Termo LGPD -->
        <div class="flex items-start gap-2.5 pt-4 border-t border-border/40">
          <input
            type="checkbox"
            id="lgpd-consent"
            required
            class="mt-1 w-4 h-4 cursor-pointer accent-primary"
          />
          <label for="lgpd-consent" class="text-xs text-muted-foreground cursor-pointer flex-1 leading-snug">
            Autorizo o tratamento dos dados pessoais fornecidos neste formulário para fins de cadastro e divulgação da plataforma Carnaval Feminino, em conformidade com a Lei Geral de Proteção de Dados (LGPD - Lei nº 13.709/2018). *
          </label>
        </div>

        <!-- Submit actions -->
        <div class="flex gap-3 pt-4 border-t border-border/40">
          <button 
            type="submit"
            id="submit-btn"
            class="flex-1 bg-primary hover:bg-primary/95 text-white font-bold py-3 px-4 rounded-lg text-sm shadow-md transition-all duration-300 hover:scale-[1.01]"
          >
            Salvar Bloco
          </button>
          <a 
            href="admin.html" 
            class="border border-input hover:bg-muted text-foreground font-semibold py-3 px-6 rounded-lg text-sm transition-smooth text-center"
          >
            Cancelar
          </a>
        </div>

      </form>
    </div>

  </div>

  <!-- Shared JS Library -->
  <script src="assets/js/db.js"></script>

  <!-- Form Controller -->
  <script>
    let blockToEdit = null;
    let base64Photo = '';

    const activitiesList = [
      { id: 'venda', label: 'Venda de produtos tais como camisetas e outros para arrecadação' },
      { id: 'encontros', label: 'Encontros, festas, shows e outros eventos sendo cobrados' },
      { id: 'ensaios_publico', label: 'Encontros para ensaio e abertos ao Público' },
      { id: 'ensaios_aprendizado', label: 'Encontros para ensaio e aprendizagem das participantes' },
      { id: 'oficinas', label: 'Oficinas de formação rítmica para novos integrantes' },
      { id: 'protesto', label: 'Participação em movimentos sociais tais como participação em outras organizações carnavalescas' },
      { id: 'dialogos', label: 'Diálogos institucionais com o poder público para viabilizar desfiles, ensaios e apresentações' },
      { id: 'formacao_politica', label: 'Formação política feminista em sintonia com os objetivos do grupo' },
      { id: 'outro', label: 'Outros' }
    ];

    let currentUser = null;

    // Check auth guard
    window.addEventListener('load', () => {
      currentUser = getCurrentUser();
      if (!currentUser) {
        window.location.href = 'login.html';
        return;
      }
      
      renderChecklist();

      // Read ID if editing
      const urlParams = new URLSearchParams(window.location.search);
      const editId = urlParams.get('id');

      if (editId) {
        blockToEdit = getBlock(editId);
        if (blockToEdit) {
          checkBlockPermissionAndFill();
        }
      }
    });

    window.addEventListener('userSessionUpdated', () => {
      currentUser = getCurrentUser();
      if (blockToEdit) {
        checkBlockPermissionAndFill();
      }
    });

    function checkBlockPermissionAndFill() {
      if (!currentUser || !blockToEdit) return;
      
      // Allow if admin or if the block belongs to the user
      if (!currentUser.isAdmin && blockToEdit.ownerId !== currentUser.id) {
        showToast('Erro: Você não tem permissão para editar este bloco! ', 'error');
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 1200);
        return;
      }
      fillFormWithBlock(blockToEdit);
    }

    // Helper to toggle visibility of custom activity input
    function toggleOutroInput(chk) {
      const input = document.getElementById('act-outro-text');
      if (input) {
        if (chk.checked) {
          input.classList.remove('hidden');
          input.required = true;
        } else {
          input.classList.add('hidden');
          input.required = false;
          input.value = '';
        }
      }
    }

    // Render Checklist DOM
    function renderChecklist() {
      const container = document.getElementById('atividades-checklist');
      container.innerHTML = '';
      
      activitiesList.forEach(item => {
        const div = document.createElement('div');
        div.className = "flex flex-col gap-1.5 mb-2";
        
        let extraInput = '';
        if (item.id === 'outro') {
          extraInput = `
            <input 
              type="text" 
              id="act-outro-text" 
              placeholder="Descreva outra atividade..."
              class="w-full mt-1 px-3 py-1.5 border border-input rounded-lg bg-background text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary/50 transition-smooth hidden"
            />
          `;
        }

        div.innerHTML = `
          <div class="flex items-start gap-2.5">
            <input
              type="checkbox"
              value="${item.id}"
              id="act-${item.id}"
              class="mt-1 w-4 h-4 cursor-pointer accent-primary"
              ${item.id === 'outro' ? 'onchange="toggleOutroInput(this)"' : ''}
            />
            <label for="act-${item.id}" class="text-sm text-muted-foreground cursor-pointer flex-1 leading-snug">
              ${item.label}
            </label>
          </div>
          ${extraInput}
        `;
        container.appendChild(div);
      });
    }

    // Fill form fields
    function fillFormWithBlock(b) {
      document.getElementById('form-title').innerText = 'Editar Bloco';
      document.querySelector('form p').innerText = 'Atualize as informações do seu bloco';
      
      document.getElementById('nome').value = b.nome || '';
      document.getElementById('responsavel').value = b.responsavel || '';
      document.getElementById('descricao').value = b.descricao || '';
      document.getElementById('contato').value = b.contato || '';
      document.getElementById('formacao').value = b.formacao || '';
      document.getElementById('dias').value = b.dias || '';
      document.getElementById('endereco').value = b.endereco || '';
      document.getElementById('cidade').value = b.cidade || '';
      document.getElementById('estado').value = b.estado || '';
      document.getElementById('vertente').value = b.vertenteFeminista || '';
      document.getElementById('localLat').value = b.localLat || '';
      document.getElementById('localLng').value = b.localLng || '';

      // Checkboxes
      if (b.atividades) {
        const activeActs = b.atividades.split('|').filter(Boolean);
        activeActs.forEach(act => {
          if (act.startsWith('outro:')) {
            const val = act.replace('outro:', '');
            const chk = document.getElementById('act-outro');
            if (chk) {
              chk.checked = true;
              toggleOutroInput(chk);
            }
            const txt = document.getElementById('act-outro-text');
            if (txt) txt.value = val;
          } else {
            const chk = document.getElementById(`act-${act}`);
            if (chk) chk.checked = true;
          }
        });
      }

      // Socials
      if (b.redesSociais) {
        document.getElementById('instagram').value = b.redesSociais.instagram || '';
        document.getElementById('facebook').value = b.redesSociais.facebook || '';
      }

      // Foto
      if (b.foto) {
        base64Photo = b.foto;
        document.getElementById('foto-url').value = b.foto.startsWith('http') ? b.foto : '';
        document.getElementById('foto-preview').src = b.foto;
        document.getElementById('foto-preview-container').classList.remove('hidden');
      }
    }

    // Process image file input to base64
    function processImageFile(input) {
      const file = input.files[0];
      if (!file) return;

      if (file.size > 2 * 1024 * 1024) {
        showToast('Erro: A foto excede o tamanho máximo de 2MB! ');
        input.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        base64Photo = e.target.result;
        
        // Update URL input and preview
        document.getElementById('foto-url').value = '';
        document.getElementById('foto-preview').src = base64Photo;
        document.getElementById('foto-preview-container').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    // nominatim geocoder helper
    async function autodetectCoordinates() {
      const address = document.getElementById('endereco').value;
      const city = document.getElementById('cidade').value;
      const state = document.getElementById('estado').value;

      if (!address && !city && !state) {
        showToast('Erro: Preencha ao menos o endereço ou a cidade para buscar! ');
        return;
      }

      showToast('Buscando coordenadas no mapa... ');

      const query = [address, city, state].filter(Boolean).join(', ');
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
      
      try {
        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!res.ok) throw new Error();
        const data = await res.json();
        
        if (Array.isArray(data) && data.length > 0) {
          const match = data[0];
          document.getElementById('localLat').value = Number(match.lat).toFixed(5);
          document.getElementById('localLng').value = Number(match.lon).toFixed(5);
          showToast('Coordenadas encontradas e preenchidas! ');
        } else {
          showToast('Coordenadas não encontradas. Verifique a grafia do endereço. ');
        }
      } catch (err) {
        showToast('Erro na requisição da busca de endereço.');
      }
    }

    // Submit block form
    async function handleFormSubmit(event) {
      event.preventDefault();

      const nome = document.getElementById('nome').value.trim();
      const responsavel = document.getElementById('responsavel').value.trim();
      const descricao = document.getElementById('descricao').value.trim();
      const contato = document.getElementById('contato').value.trim();
      const formacao = document.getElementById('formacao').value.trim();
      const dias = document.getElementById('dias').value.trim();
      const endereco = document.getElementById('endereco').value.trim();
      const cidade = document.getElementById('cidade').value.trim();
      const estado = document.getElementById('estado').value.trim().toUpperCase();
      const vertente = document.getElementById('vertente').value.trim();
      
      let lat = document.getElementById('localLat').value;
      let lng = document.getElementById('localLng').value;

      // Validate coordinates or autodetect on submission
      if ((!lat || !lng) && (endereco || cidade || estado)) {
        showToast('Buscando coordenadas antes de salvar...');
        const query = [endereco, cidade, estado].filter(Boolean).join(', ');
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
        
        try {
          const res = await fetch(url);
          const data = await res.json();
          if (data && data.length > 0) {
            lat = Number(data[0].lat).toFixed(5);
            lng = Number(data[0].lon).toFixed(5);
          }
        } catch(e) {}
      }

      // Check checkboxes
      const selectedActs = [];
      document.querySelectorAll('#atividades-checklist input[type="checkbox"]').forEach(chk => {
        if (chk.checked && chk.value !== 'outro') {
          selectedActs.push(chk.value);
        }
      });

      const chkOutro = document.getElementById('act-outro');
      if (chkOutro && chkOutro.checked) {
        selectedActs.push('outro');
        const txtOutro = document.getElementById('act-outro-text').value.trim();
        if (txtOutro) {
          selectedActs.push('outro:' + txtOutro);
        }
      }

      // Photo handling
      const urlPhoto = document.getElementById('foto-url').value.trim();
      const finalPhoto = urlPhoto ? urlPhoto : base64Photo;

      const blockData = {
        id: blockToEdit ? blockToEdit.id : undefined,
        nome: nome,
        responsavel: responsavel,
        descricao: descricao,
        contato: contato,
        formacao: formacao,
        dias: dias,
        endereco: endereco,
        cidade: cidade,
        estado: estado,
        vertenteFeminista: vertente,
        localLat: lat ? parseFloat(lat) : null,
        localLng: lng ? parseFloat(lng) : null,
        atividades: selectedActs.join('|'),
        foto: finalPhoto,
        redesSociais: {
          instagram: document.getElementById('instagram').value.trim(),
          facebook: document.getElementById('facebook').value.trim()
        },
        imagens: blockToEdit ? blockToEdit.imagens : [],
        videos: blockToEdit ? blockToEdit.videos : []
      };

      try {
        await saveBlock(blockData);
        showToast('Bloco salvo com sucesso! ');
        
        setTimeout(() => {
          window.location.href = 'admin.html';
        }, 1000);
      } catch (err) {
        showToast('Erro ao salvar bloco: ' + err.message);
      }
    }

    // Sync input url to preview box
    document.getElementById('foto-url').addEventListener('input', (e) => {
      const url = e.target.value.trim();
      const container = document.getElementById('foto-preview-container');
      const img = document.getElementById('foto-preview');
      
      if (url.startsWith('http')) {
        img.src = url;
        container.classList.remove('hidden');
      } else if (!base64Photo) {
        container.classList.add('hidden');
      } else {
        img.src = base64Photo;
      }
    });
  </script>
</body>
</html>
